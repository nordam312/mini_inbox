services:
  postgres:
    image: postgres:17-alpine
    container_name: mini-inbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mini_inbox
      POSTGRES_PASSWORD: mini_inbox
      POSTGRES_DB: mini_inbox
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
