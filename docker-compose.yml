services:
  postgres:
    image: postgres:17-alpine
    container_name: mini-inbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mini_inbox
      POSTGRES_PASSWORD: mini_inbox
      POSTGRES_DB: mini_inbox
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # `pnpm setup` runs `docker compose up -d --wait`, which blocks until this
    # passes. Without it --wait only waits for the container to be running, and
    # migrations would race a database that is not accepting connections yet.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mini_inbox -d mini_inbox']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
